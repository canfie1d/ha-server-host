name: HA Server Host
version: "2.0.4"
slug: ha_server_host
description: Runs your servers from their GitHub releases, routes each hostname to its server and keeps them healthy
url: https://github.com/canfie1d/ha-server-host
arch:
  - amd64
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8100
panel_icon: mdi:server-network
panel_title: Server Host
panel_admin: true
map:
  - addon_config:rw
# The one public port. Cloudflare Tunnel sends every hostname here and the host routes each
# request to the server that owns the hostname. 8100 is the panel, served through HA ingress only.
ports:
  8110/tcp: 8110
ports_description:
  8110/tcp: Every hosted server, routed by hostname. Point Cloudflare Tunnel here.
# The host's own liveness. A hosted server being down never fails it, so HA never restarts the
# add-on (and with it every server) because of one server.
watchdog: http://[HOST]:[PORT:8110]/heartbeat
image: ghcr.io/canfie1d/{arch}-addon-ha-server-host
# Settings live on the panel pages (stored in /data), not here.
options: {}
schema: {}
