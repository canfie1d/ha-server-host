name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - config.yaml
      - CHANGELOG.md

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax
        run: find src test -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Test
        run: node --test --test-timeout=240000 test/
