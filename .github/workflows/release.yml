# Releases are cut by pushing a version tag (git tag v2.0.1 && git push origin v2.0.1).
# Pushes to main only run CI.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish the amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test --test-timeout=240000 test/*.test.mjs

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/canfie1d/amd64-addon-ha-server-host:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  record:
    name: Record the released version
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set version in config.yaml and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: \"${version}\"/" config.yaml
          # HA shows CHANGELOG.md on the update screen. A section for this version written by hand
          # is kept; otherwise the commits since the previous tag are listed.
          if ! grep -q "^## ${version}$" CHANGELOG.md; then
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            notes=$(git log --no-merges --format='- %s' ${prev:+$prev..}"${GITHUB_REF_NAME}" | grep -vE '^- Release [0-9]' || true)
            [ -n "$notes" ] || notes="- Rebuilt with no code changes."
            { printf '# Changelog\n\n## %s\n\n%s\n\n' "$version" "$notes"; sed '1,2d' CHANGELOG.md; } > CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml CHANGELOG.md
          git diff --cached --quiet || git commit -m "Release ${version}"
          git push origin HEAD:main
